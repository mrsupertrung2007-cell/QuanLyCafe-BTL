<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Đổi tiêu đề cho phù hợp với trang của bạn (VD: Giỏ Hàng - Cafe Bất Ổn) -->
    <title>Giỏ hàng - Tiệm Cafe Bất Ổn</title>
    
    <!-- Link nhúng icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Link file CSS giao diện chung -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ================= HEADER DÙNG CHUNG ================= -->
    <header>
        <div class="navbar">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-mug-hot"></i> Cafe Bất Ổn
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Trang chủ</a></li>
                    <li><a href="menu.html">Thực đơn</a></li>
                    <li><a href="reservation.html">Đặt bàn</a></li>
        
                    <li>
                        <a href="cart.html" class="cart-icon">
                            <i class="fa-solid fa-cart-shopping"></i> Giỏ hàng 
                            <span id="cart-badge" class="cart-badge">0</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- ================= KHU VỰC LÀM VIỆC CỦA TỪNG NGƯỜI ================= -->
    <!-- MỌI NGƯỜI VIẾT CODE HTML CỦA MÌNH VÀO TRONG THẺ MAIN NÀY NHÉ -->
    <main>
        <div class="cart-page-wrapper">
    <h2 class="cart-title">Giỏ Hàng Của Bạn</h2>
    
    <div class="cart-layout">
        <!-- Cột trái: Danh sách sản phẩm -->
        <div class="cart-items-section">
            <div id="cart-items-container">
                <!-- JS sẽ render sản phẩm vào đây -->
            </div>
            <button id="btn-clear-cart" class="btn-danger" style="display: none;" onclick="clearCart()">Xóa toàn bộ giỏ hàng</button>
        </div>

        <!-- Cột phải: Tổng tiền & Form thanh toán -->
        <div class="checkout-section">
            <div class="order-summary">
                <h3>Tổng Đơn Hàng</h3>
                <div class="summary-row">
                    <span>Tạm tính:</span>
                    <span id="subtotal-price">0 đ</span>
                </div>
                <div class="summary-row">
                    <span>Phí giao hàng:</span>
                    <span id="shipping-fee">0 đ</span>
                </div>
                <div class="summary-row total-row">
                    <span>Tổng thanh toán:</span>
                    <span id="final-total">0 đ</span>
                </div>
            </div>

            <div class="checkout-form-container">
                <h3>Thông Tin Giao Hàng</h3>
                <!-- Form thanh toán yêu cầu validate -->
                <form id="checkout-form">
                    <div class="form-group">
                        <label for="cus-name">Họ và tên (*)</label>
                        <input type="text" id="cus-name" placeholder="Nhập họ tên người nhận">
                        <small class="error-text" id="err-name"></small>
                    </div>
                    <div class="form-group">
                        <label for="cus-phone">Số điện thoại (*)</label>
                        <input type="tel" id="cus-phone" placeholder="Nhập số điện thoại">
                        <small class="error-text" id="err-phone"></small>
                    </div>
                    <div class="form-group">
                        <label for="cus-address">Địa chỉ giao hàng (*)</label>
                        <input type="text" id="cus-address" placeholder="Số nhà, tên đường, phường/xã...">
                        <small class="error-text" id="err-address"></small>
                    </div>
                    <div class="form-group">
                        <label for="cus-note">Ghi chú</label>
                        <textarea id="cus-note" rows="3" placeholder="Ghi chú cho quán..."></textarea>
                    </div>
                    <button type="submit" class="btn-submit-order">Xác Nhận Đặt Hàng</button>
                </form>
            </div>
        </div>
    </div>
</div>
    </main>
    <!-- ================= KẾT THÚC KHU VỰC LÀM VIỆC ================= -->


    <!-- ================= FOOTER DÙNG CHUNG (KHÔNG SỬA) ================= -->
    <footer>
        <p>&copy; 2026 Tiệm Cafe Bất Ổn. Bài tập lớn Quản lý quán Cafe.</p>
    </footer>

    <!-- Link file Javascript chung (Bắt buộc để ở cuối thẻ body) -->
   <script src="js/main.js"></script>
</body>
</html>
